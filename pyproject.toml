[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-server-sourceforge"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for SourceForge - manage releases, upload files via SFTP/FRS, and fetch project analytics."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Fixitdaz" }
]
keywords = ["mcp", "model-context-protocol", "sourceforge", "llm", "ai", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
    "paramiko>=3.4.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
mcp-server-sourceforge = "mcp_server_sourceforge.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_sourceforge"]
